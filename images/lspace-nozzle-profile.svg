<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 410" font-family="JetBrains Mono, Consolas, monospace">
  <!-- Nozzle flow-passage profile redrawn from the SolidWorks sketch. Scale: 12 px = 1 mm.
       Inlet r6 | 35 deg converging | throat r2.5 (0.5 land) | 30 deg initial expansion | bell to r10 over 27 mm -->
  <defs>
    <linearGradient id="flow" x1="0" x2="1">
      <stop offset="0" stop-color="#60a5fa" stop-opacity=".10"/>
      <stop offset=".55" stop-color="#60a5fa" stop-opacity=".16"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity=".24"/>
    </linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L10 5 L0 9Z" fill="#60a5fa"/>
    </marker>
  </defs>

  <!-- centerline -->
  <line x1="28" y1="190" x2="922" y2="190" stroke="#737373" stroke-width="1.2" stroke-dasharray="18 5 3 5"/>

  <!-- flow passage -->
  <path d="M60 118 L503 118 Q510 118 516 122.2 L570 160 L576 160 Q732 70 900 70
           L900 310 Q732 310 576 220 L570 220 L516 257.8 Q510 262 503 262 L60 262 Z"
        fill="url(#flow)" stroke="#e5e5e5" stroke-width="2.2" stroke-linejoin="round"/>

  <text x="78" y="182" font-size="13" fill="#a3a3a3">air in →</text>

  <g stroke="#60a5fa" stroke-width="1.2" fill="none">
    <!-- Ø12 inlet -->
    <line x1="112" y1="121" x2="112" y2="259" marker-start="url(#a)" marker-end="url(#a)"/>
    <!-- Ø20 exit -->
    <line x1="900" y1="70" x2="950" y2="70" stroke-opacity=".5"/>
    <line x1="900" y1="310" x2="950" y2="310" stroke-opacity=".5"/>
    <line x1="940" y1="73" x2="940" y2="307" marker-start="url(#a)" marker-end="url(#a)"/>
    <!-- extension lines -->
    <line x1="510" y1="268" x2="510" y2="362" stroke-opacity=".5"/>
    <line x1="573" y1="226" x2="573" y2="362" stroke-opacity=".5"/>
    <line x1="900" y1="316" x2="900" y2="362" stroke-opacity=".5"/>
    <!-- 5 mm converging length, 27 mm bell -->
    <line x1="513" y1="352" x2="570" y2="352" marker-start="url(#a)" marker-end="url(#a)"/>
    <line x1="576" y1="352" x2="897" y2="352" marker-start="url(#a)" marker-end="url(#a)"/>
    <!-- Ø5 throat -->
    <line x1="573" y1="163" x2="573" y2="217" marker-start="url(#a)" marker-end="url(#a)"/>
    <!-- 35° converging angle -->
    <line x1="510" y1="118" x2="566" y2="118" stroke-dasharray="4 4" stroke-opacity=".6"/>
    <path d="M552 118 A42 42 0 0 1 544.4 142.1"/>
    <!-- 30° initial expansion angle -->
    <line x1="576" y1="160" x2="648" y2="160" stroke-dasharray="4 4" stroke-opacity=".6"/>
    <path d="M630 160 A54 54 0 0 0 622.8 133"/>
  </g>

  <g fill="#93c5fd" font-size="15">
    <text x="122" y="226">Ø12</text>
    <text x="952" y="195">Ø20</text>
    <text x="952" y="214" font-size="12" fill="#737373">exit</text>
    <text x="541" y="343" text-anchor="middle">5</text>
    <text x="737" y="343" text-anchor="middle">27</text>
    <text x="558" y="400" text-anchor="middle">Ø5 throat</text>
    <text x="556" y="104">35°</text>
    <text x="650" y="155">30°</text>
  </g>
  <line x1="573" y1="362" x2="573" y2="382" stroke="#60a5fa" stroke-width="1.2" stroke-opacity=".5"/>
  <text x="1000" y="400" text-anchor="end" font-size="11" fill="#737373">mm</text>
</svg>
